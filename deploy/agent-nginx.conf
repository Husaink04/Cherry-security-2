server {
  listen 8443 ssl;
  server_name _;
  server_tokens off;
  # Docker's DNS, rechecked every 10s, so a recreated api container is found without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/cherrysecurity-tls/server.crt;
  ssl_certificate_key /run/cherrysecurity-tls/server.key;
  client_max_body_size 768k;
  client_body_timeout 10s;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /api/agent/enroll {
    if ($request_method != POST) { return 405; }
    proxy_pass $api_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location = /api/agent/policy {
    if ($request_method != GET) { return 405; }
    proxy_pass $api_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location = /api/agent/heartbeat {
    if ($request_method != POST) { return 405; }
    proxy_pass $api_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location = /api/agent/events {
    if ($request_method != POST) { return 405; }
    proxy_pass $api_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
  }
  location / { return 404; }
}
